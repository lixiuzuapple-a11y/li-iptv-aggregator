# Li IPTV Aggregator — 生产配置（TASK-006 §5）
#
# 本文件是**生产配置的正本**：安装器会把它写入 /etc/li-iptv-aggregator/config.toml，
# 其中的路径一律是**绝对路径**，按实际安装前缀生成（默认前缀 = /，或用 --root 指定）。
# 下面这组是默认前缀下的取值：
#
#   database.path        = /var/lib/li-iptv-aggregator/liptv.sqlite3
#   output.m3u_path      = /var/lib/li-iptv-aggregator/live.m3u
#   publish.summary_path = /var/lib/li-iptv-aggregator/publish-summary.json
#   runtime.status_path  = /var/lib/li-iptv-aggregator/runtime-status.json
#   runtime.lock_path    = /run/li-iptv-aggregator/liptv.lock
#   fetch.dynamic_tmp_dir= /var/cache/li-iptv-aggregator/tmp
#
# 安装后**永不覆盖**：运维可以直接改这份文件（安装器只会创建它）。
#
# 约定（勿改）：**全部绝对路径**；`probe.enabled` 与动态赛事源默认 **false**，
# 只有部署者明确启用后才会去请求真实流 / 真实动态源；本文件**不得**写入任何真实
# 私密 URL 或凭据（安装器也会校验：出现带 query 的 URL / `enabled = true` 的来源即拒绝）。

[database]
# SQLite 持久状态（唯一权威数据）
path = "@@DB_PATH@@"

[output]
# 播放器订阅的成品（last-known-good 也留在这个目录）
m3u_path = "@@OUTPUT_PATH@@"
keep_previous = true

[selection]
# 与代码默认值一致，显式写出便于运维审阅
window_days = 7
max_consecutive_failures = 3
min_successes = 1

[fetch]
timeout_seconds = 10.0
max_bytes = 5000000
max_redirects = 3
user_agent = "liptv/1.0 (+personal IPTV aggregator; python-urllib)"
# 动态赛事快照只能落在可丢弃缓存目录（且仍受 Git 护栏约束）
dynamic_tmp_dir = "@@DYNAMIC_TMP_DIR@@"

[publish]
summary_path = "@@SUMMARY_PATH@@"
dynamic_group_title = "体育赛事（实时）"
# 留空 = 用数据库里 enabled 的动态源；运行期默认不联网
dynamic_sources = []

[publish.dynamic]
include_groups = []
exclude_groups = ["宣传", "公告", "推广", "广告"]
exclude_group_keywords = ["✈️", "TG频道", "TG 频道", "下载", "app"]
replay_sections = ["赛事回放", "回放", "录像", "重播"]
replay_groups = ["赛事回放", "回放", "录像", "重播"]
include_replay = false

[runtime]
# 完整周期 3 小时；stale 阈值取 2 倍周期（6 小时）
interval_seconds = 10800
run_on_start = true
lock_path = "@@LOCK_PATH@@"
status_path = "@@STATUS_PATH@@"
stale_after_seconds = 21600
status_history = 5
# 默认完全不碰公网动态源（要在生产启用请显式改 true 并登记来源）
include_dynamic = false
dynamic_sources = []
require_dynamic = false

[server]
# 默认只绑 loopback：对外暴露交给外层 VPN / 反向代理（见 deploy/reverse-proxy/）
enabled = true
host = "127.0.0.1"
port = 8080
playlist_path = "/live.m3u"
health_path = "/healthz"
# TASK-011 REVIEW-01 R1.2：显式写出，不依赖代码默认值。
# 注意这是**路由**不是文件路径 —— 实际文件由 [epg].output_path 决定。
epg_path = "/epg.xml"

# 🚨 TASK-011 REVIEW-01 R1：EPG 运行期产物必须落在**可写数据目录**。
#
# 为什么不能放 /etc（这是本轮返工的核心）：
#   - /etc 是**配置**目录，EPG 是运行期生成 + LKG 的**数据**；
#   - service 开了 ProtectSystem=strict，systemd 只放开 /var/lib /var/cache //run
#     三个可写运行目录；
#   - 与 live.m3u 同类文件同属一个生命周期，必须同目录。
#
# REVIEW-01 实测证据：上一轮 epg.xml 被放在 /etc/li-iptv-aggregator/ 且为
# root:root 0600 ⇒ 服务账号 liptv **读不到** + /epg.xml 实际返回 404。
[epg]
# 是否提供 /epg.xml 端点。**必须 true**，否则 CLI 不注册该路由（返回 404）——
# 这是上一轮「EPG 已上线」不成立的直接根因。
enabled = true
# 与 live.m3u 同目录、同属主同权限（liptv:liptv 0640）
output_path = "@@EPG_OUTPUT_PATH@@"
status_path = "@@EPG_STATUS_PATH@@"
# 只输出 metadata 里登记了 epg_channel_id 的频道：播放器只按 M3U 的 tvg-id 找节目。
restrict_to_metadata = true
# 主力源：fanmingming 经 jsDelivr CDN。生产机 raw.githubusercontent.com 不通，
# 必须走 CDN（2026-10-06 实测）。epg.pw 覆盖更广但是纯数字 id、需人工 42 条
# 映射，仅作灾备（REVIEW-01 Q4裁决：TASK-011 不做）。
#
# 🚨 必须用 `[[epg.sources]]` **单行**写法，不要用多行内联数组
#    （sources = [ { url = ... } ]）：安装器的凭据/带query URL 校验是
#    **逐行正则扫描**，多行内联数组会让 URL 整段绕过校验 —— 那等于给未来
#    留了一个可以静默写入 token 的口子。
# 🚨 不要写带 query/token 的 URL（校验命中即拒绝安装）。
[[epg.sources]]
key = "fanmingming-jsdelivr"
url = "https://cdn.jsdelivr.net/gh/fanmingming/live@main/e.xml"

[probe]
# **默认关闭**：升级部署不会让服务突然去请求全部播放流。
# 启用前请先跑 `python -m liptv doctor --config …`（会要求 ffprobe 可用）。
enabled = false
name = "linux-host"
location = "Linux"
ffprobe_path = "/usr/bin/ffprobe"
timeout_seconds = 12.0
analyze_seconds = 4.0
max_concurrency = 4
per_round_limit = 0

# 来源清单默认留空 = 服务不会发任何出网请求。
# 启用时请把 URL 写进本机 /etc（**不要**提交进 Git），例如：
#
# [[sources]]
# name = "my-fixed-source"
# kind = "fixed_m3u"
# url = "https://upstream.example/list.m3u"   # 不要带 token/query
# enabled = true

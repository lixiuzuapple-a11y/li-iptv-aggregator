# ============================================================ 刻意不收（可审计的取舍）
#
# 1) `CCTV-1 HD` / `CCTV-6 HD` / `CCTV-13 HD` / `CCTV-14 HD` / `CCTV-17 HD`
#    —— 归一后与 `CCTV-N` **不同**（HD 不是末尾分辨率括号，不剥）。
#    §2A 允许「高清作为同频道 stream variant」，但本项目 normalize_name
#    不做「HD 后缀折叠」⇒ 归一后是两个频道；§2A 同时禁止「未经证据自动合并」。
#    本轮**不做这个合并**，因此这些 HD 条目**不收**（而非收进来当另一个频道）。
#    代价：CCTV-1 等少一条 iptv-org 侧 HD 线路。收益：不为凑线路破规则。
#
# 2) `CCTV-4K HD` / `CCTV-8K HD` —— 同上，且§6.4 明确「不追求 4K」。
#
# 3) `CCTV-6 [Geo-blocked]` —— 上游**自己**标注 geo-block。§3.3 要求识别
#    geo-block；已标注条目无复核价值，且若它是 CCTV-6 的唯一线路会污染多线路
#    判断。剔除后 CCTV-6 用 guovin 的 5 条。
#
# 4) `电视指南` / `普陀电视台` / `绍兴电视台公共` / `通海电视台` / `青田电视台`
#    —— 地方市县台，不在 §2A/§2B 优先清单内，且多为单线路。
#    §5.1 要求 curated set；§1 要求「不为了凑 60 个而保留差频道」。
#
# 5) `CHC动作电影` / `CHC家庭影院` —— 付费院线频道，公开列表中出现属上游
#    收录问题；不作为「日常有意义」的固定频道收录。
#
# 6) `三沙卫视` / `大湾区卫视` / `内蒙古卫视` / `新疆卫视`
#    —— 均为 guovin 3 条，质量与其他卫视相当；本轮 41 个已满足 §5.2 第一阶段
#    目标（30）与 §11 硬指标，**不为凑数继续收**。后续若 probe 结果显示
#    现有线路质量不足，可优先从这批里补。
#
# 7) iptv-org-kr（81 条）/ hk（18）/ tw（26）/ jp（7）—— 实测均 HTTP 200 可解析，
#    但全部属 iptv-org **同一项目**，不构成跨独立源 multi-stream（§6.2 要求
#    「来自 2 个独立 source」）；且 CCTV/卫视已足够支撑 ≥30 目标。
#    本轮记录在 SOURCES/FIXED-SOURCE-RECON-TASK010.md，不纳入生产。
#
# 8) 国际新闻（Al Jazeera / DW / France 24 / NHK World / CGTN Doc）
#    —— 本机探测见侦察报告：**DNS 全部 OK**，5 个里3 个在本机被FlClash TUN
#    透明代理切断 TLS（SSLEOFError），France 24 / NHK World 可 200。
#    「本机不可达」不等于「上海生产机不可达」，而 §2C 要求以生产实测为准。
#    本轮不把它们写进生产 fixed（避免把未在生产验证的线路混进 §6 质量门槛），
#    改列为「需生产主机复验后纳入」的候补。

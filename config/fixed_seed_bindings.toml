# TASK-010 fixed seed binding —— 显式映射，**不含任何 stream URL 或签名 query**
#
# 用途：把 TASK-009 的 10 个 canonical 扩充到 41 个，形成日常可用的频道集合。
# 任务书：TASKS/TASK-010.md §2（内容范围）/ §5（扩充策略）/ §6（质量门槛）
#
# ── 设计红线（严格遵守，未因扩量而放松）────────────────────────────
# TASKS/TASK-010.md §5.3：
#   *绝不做 fuzzy / Levenshtein / NLP /「名字差不多」；
#   * 只允许 exact_normalized（归一后逐字节相等）与显式 alias
#     （见 config/fixed_aliases.toml）；
#   * 归一后在**任一来源内不唯一** ⇒ 判 ambiguous，**跳过不绑**，绝不猜。
#
# TASKS/TASK-010.md §5.1：不允许「全量灌库然后自动猜」。
#   321 个归一后频道里只挑 41 个 —— 依据是「真实多线路 + 日常有意义」，
#   而不是「源里有就加」。
#
# TASKS/TASK-010.md §2A 硬约束：
#   * CCTV-5 与 CCTV-5+ **不合并**（常规频道 vs 体育赛事频道，语义不同）；
#   * 「名称相近 ≠ 同频道」：`CCTV-1` 与 `CCTV-1 HD` 归一后**仍是两个不同
#     canonical**，本轮**都不收**（见文末「刻意不收」）；
#   * `CCTV-6 [Geo-blocked]` 这类上游自带 geo-block 标记的条目**不收**。
#
# 归一规则（白名单式，只有这一条，见 tools/build_fixed_seed.py::normalize_name）：
#   1. 剥离**末尾**的分辨率括号： (720p) (1080p) (1080i) (576i) (480p) 等；
#   2. 其余字符（中文/字母/数字/空格/连字符）**逐字节保留**，不做任何模糊处理；
#   3. 归一后若在**任一来源内不唯一**（多个不同原始名撞同一key）⇒ 判 ambiguous。
#   ⚠️ 注意：「同一来源内同名**多条**不同 host」**不是**歧义，那正是同一频道的
#      多线路（multi-stream），是本轮要保留的东西。
#
# ── 扩量依据（2026-10-06 实测，非估算）────────────────────────────
#   iptv-org-cn    ：145 条原始 → 剔除签名/身份 → 保留 131
#   guovin-gd-ipv4 ：473 条原始 → 剔除签名/身份 → 保留 370
#   归一后 321 个频道，非歧义 321 个，其中跨独立源 12 个。
#
#   本文件收录的 41 个 canonical 全部满足 streams ≥ 2（多数 ≥ 3）。
#   单线路 canonical 一律不收 —— 无法验证「按历史选线」，且线路挂掉频道就消失。
#
# ── 字段说明 ────────────────────────────────────────────────────────
#   canonical    —— canonical channel 显示名（进 live.m3u 的名字）
#   category     —— 分组，决定 M3U 的 group-title（§9.1）
#   match        —— 匹配方式，只允许 exact_normalized（归一后完全相等）
#   source_names —— 参与匹配的来源；两侧都有的条目才建立多 stream
#   note         —— 为什么绑、依据是什么（审计用）


# Li IPTV Aggregator — V1 默认配置
# 复制成 config/config.toml 后按需修改；缺省项自动回落到代码内默认值。

[database]
path = "data/liptv.sqlite3"

[output]
m3u_path = "out/live.m3u"
# 生成成功时把上一版另存为 live.previous.m3u（last-known-good 回滚用）
keep_previous = true

[selection]
# 选线窗口与最低可用阈值，见 V1_RUNTIME_FLOW.md §5 / §6
window_days = 7
# 连续失败达到该值时该线路不再参与选择
max_consecutive_failures = 3
# 窗口内至少需要成功多少次才算可用
min_successes = 1

[category_order]
# M3U group-title 的输出与排序顺序
groups = [
  "体育",
  "新闻",
  "影视",
  "纪录片",
  "港澳台",
  "国际",
  "音乐",
  "动漫",
  "儿童",
  "地方台",
  "其他",
]

[fetch]
# 远程拉取限制（TASK-002）。所有项都有代码内默认值，这里只是显式写出。
timeout_seconds = 10.0
# 单次响应体上限（字节）。超过即判 RESPONSE_TOO_LARGE，不写入库存。
max_bytes = 5000000
# 最多跟随几次重定向。0 表示不跟随。超限即判 TOO_MANY_REDIRECTS。
max_redirects = 3
# 只请求被登记的 M3U 文本；不会去请求条目里的播放地址。
user_agent = "liptv/1.0 (+personal IPTV aggregator; python-urllib)"
# 动态赛事快照只能写到这个目录。`dynamic-fetch --out` 会做三道强制校验：
#   ① 目标必须在本目录之内；
#   ② 目标在 Git 层面必须安全 —— 位于某个 Git 工作树内时必须被 .gitignore 忽略，
#      不在任何工作树内则允许；
#   ③ 目标不得已被该工作树跟踪（在 Git 索引里）—— .gitignore 对已跟踪文件不生效，
#      曾经 `git add -f` 过的文件必须另行拦截。
# 任一不满足即拒绝写入且不创建文件（连旧文件一个字节都不动）。
# 因此**不要**把它改成仓库内未被忽略的目录（如 SOURCES/），否则会被直接拒绝。
dynamic_tmp_dir = "out/tmp"

# ---------------------------------------------------------------- 来源注册
# 用 `python -m liptv source-register --from-config` 把下面的条目同步进数据库。
# 默认**全部禁用**：`fetch --all` 只抓 enabled = true 的 fixed_m3u 来源，
# 所以照搬本文件也不会向任何公网地址发请求。
#
# kind 取值：
#   fixed_m3u         相对稳定的频道列表 → 抓取后可进入 canonical/stream 流程
#   dynamic_event_m3u 动态赛事列表 → 只做临时获取/预览，绝不进固定频道库存
#   local-m3u         本地文件导入（由 import-m3u 使用）

# 演示用：指向本机 mock 服务（先运行 python tools/mock_source_server.py --port 8800）
[[sources]]
name = "demo-fixed"
kind = "fixed_m3u"
url = "http://127.0.0.1:8800/ok.m3u"
enabled = false

# JSNZKPG 体育赛事动态源（见 SOURCES/JSNZKPG-SPORTS.md）
# 【仅登记，默认禁用】—— 防止 fetch --all 默认向其发请求。
# 需要时用显式命令预览：python -m liptv dynamic-fetch --source jsnzkpg-sports
#            或显式合入发布：python -m liptv publish --dynamic-source jsnzkpg-sports
# （`publish` 默认**不联网**，只有显式传 --dynamic / --dynamic-source 才会拉取动态源。）
[[sources]]
name = "jsnzkpg-sports"
kind = "dynamic_event_m3u"
url = "https://jsnzkpg.de5.net/all.m3u"
enabled = false

# ---------------------------------------------------------------- 统一发布
# `python -m liptv publish` 的一次性组合与安全发布策略（TASK-003）。
# 只写一个**本地** M3U 文件；不部署、不定时调度、不对外托管，
# 也不清除「静态文件在下次刷新前不会自动过期」这一限制。

[publish]
# 发布摘要（JSON，已脱敏：不含任何完整签名 URL / 动态整表）。
# 必须落在被 .gitignore 忽略的目录里，否则发布会被护栏拒绝。
summary_path = "out/publish-summary.json"
# 动态赛事条目统一归入这个分组，与固定频道分组严格隔开
dynamic_group_title = "体育赛事（实时）"
# 未显式传 --dynamic-source 时要用的动态来源登记名。
# 留空 = 使用数据库中所有 enabled = true 的动态来源（本示例中没有任何启用的动态源，
# 因此照搬本文件后 bare `publish` 不会向公网发任何请求）。
dynamic_sources = []

# 动态纳入规则：简单、配置化、可解释。判断不了的一律**不纳入**（宁漏不误删），
# 并把过滤理由与计数写进发布摘要。这里刻意不做复杂赛事识别。
[publish.dynamic]
# 只纳入明确被标识为赛事的分组（精确匹配）
include_groups = ["正在直播", "即将开始", "赛事回放"]
# 即使出现在上面的白名单里也要排除的非赛事分组（精确匹配）
exclude_groups = ["宣传", "公告", "推广"]
# 分组名含这些关键词同样排除（如 ✈️TG频道 之类推广入口）；大小写不敏感
exclude_group_keywords = ["✈️", "TG频道", "TG 频道", "下载", "app"]
# 回放分组单独可控
replay_groups = ["赛事回放", "回放"]
# 默认**关闭**：回放不是实时赛事。需要时在命令行/本地配置里显式打开。
include_replay = false

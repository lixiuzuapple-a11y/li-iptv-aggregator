# Li IPTV Aggregator — V1 默认配置
# 复制成 config/config.toml 后按需修改；缺省项自动回落到代码内默认值。

[database]
path = "data/liptv.sqlite3"

[output]
m3u_path = "out/live.m3u"
# 生成成功时把上一版另存为 live.previous.m3u（last-known-good 回滚用）
keep_previous = true

[selection]
# 选线窗口与最低可用阈值，见 V1_RUNTIME_FLOW.md §5 / §6
window_days = 7
# 连续失败达到该值时该线路不再参与选择
max_consecutive_failures = 3
# 窗口内至少需要成功多少次才算可用
min_successes = 1

[category_order]
# M3U group-title 的输出与排序顺序
groups = [
  "体育",
  "新闻",
  "影视",
  "纪录片",
  "港澳台",
  "国际",
  "音乐",
  "动漫",
  "儿童",
  "地方台",
  "其他",
]

[fetch]
# 远程拉取限制（TASK-002）。所有项都有代码内默认值，这里只是显式写出。
timeout_seconds = 10.0
# 单次响应体上限（字节）。超过即判 RESPONSE_TOO_LARGE，不写入库存。
max_bytes = 5000000
# 最多跟随几次重定向。0 表示不跟随。超限即判 TOO_MANY_REDIRECTS。
max_redirects = 3
# 只请求被登记的 M3U 文本；不会去请求条目里的播放地址。
user_agent = "liptv/1.0 (+personal IPTV aggregator; python-urllib)"
# 动态赛事快照只能写到这个目录。`dynamic-fetch --out` 会做三道强制校验：
#   ① 目标必须在本目录之内；
#   ② 目标在 Git 层面必须安全 —— 位于某个 Git 工作树内时必须被 .gitignore 忽略，
#      不在任何工作树内则允许；
#   ③ 目标不得已被该工作树跟踪（在 Git 索引里）—— .gitignore 对已跟踪文件不生效，
#      曾经 `git add -f` 过的文件必须另行拦截。
# 任一不满足即拒绝写入且不创建文件（连旧文件一个字节都不动）。
# 因此**不要**把它改成仓库内未被忽略的目录（如 SOURCES/），否则会被直接拒绝。
dynamic_tmp_dir = "out/tmp"

# ---------------------------------------------------------------- 来源注册
# 用 `python -m liptv source-register --from-config` 把下面的条目同步进数据库。
# 默认**全部禁用**：`fetch --all` 只抓 enabled = true 的 fixed_m3u 来源，
# 所以照搬本文件也不会向任何公网地址发请求。
#
# kind 取值：
#   fixed_m3u         相对稳定的频道列表 → 抓取后可进入 canonical/stream 流程
#   dynamic_event_m3u 动态赛事列表 → 只做临时获取/预览，绝不进固定频道库存
#   local-m3u         本地文件导入（由 import-m3u 使用）

# 演示用：指向本机 mock 服务（先运行 python tools/mock_source_server.py --port 8800）
[[sources]]
name = "demo-fixed"
kind = "fixed_m3u"
url = "http://127.0.0.1:8800/ok.m3u"
enabled = false

# JSNZKPG 体育赛事动态源（见 SOURCES/JSNZKPG-SPORTS.md）
# 【仅登记，默认禁用】—— 防止 fetch --all 默认向其发请求。
# 需要时用显式命令预览：python -m liptv dynamic-fetch --source jsnzkpg-sports
#            或显式合入发布：python -m liptv publish --dynamic-source jsnzkpg-sports
# （`publish` 默认**不联网**，只有显式传 --dynamic / --dynamic-source 才会拉取动态源。）
[[sources]]
name = "jsnzkpg-sports"
kind = "dynamic_event_m3u"
url = "https://jsnzkpg.de5.net/all.m3u"
enabled = false

# ---------------------------------------------------------------- 统一发布

# KORICE PPV 实时赛事动态源（见 SOURCES/KORICE-PPV.md）
# 【仅登记，默认禁用】—— 与 JSNZKPG 同属 dynamic_event_m3u；不进固定库存、不进 probe_result。
# 需要时显式预览：python -m liptv dynamic-fetch --source korice-ppv
#          或显式合入：python -m liptv publish --dynamic-source korice-ppv
[[sources]]
name = "korice-ppv"
kind = "dynamic_event_m3u"
url = "https://www.korice.eu.org/ppv_m3u.php"
enabled = false

# `python -m liptv publish` 的一次性组合与安全发布策略（TASK-003）。
# 只写一个**本地** M3U 文件；不部署、不定时调度、不对外托管，
# 也不清除「静态文件在下次刷新前不会自动过期」这一限制。

[publish]
# 发布摘要（JSON，已脱敏：不含任何完整签名 URL / 动态整表）。
# 必须落在被 .gitignore 忽略的目录里，否则发布会被护栏拒绝。
summary_path = "out/publish-summary.json"
# 动态赛事条目统一归入这个分组，与固定频道分组严格隔开
dynamic_group_title = "体育赛事（实时）"
# 未显式传 --dynamic-source 时要用的动态来源登记名。
# 留空 = 使用数据库中所有 enabled = true 的动态来源（本示例中没有任何启用的动态源，
# 因此照搬本文件后 bare `publish` 不会向公网发任何请求）。
dynamic_sources = []

# 动态纳入规则：简单、配置化、可解释。默认走「**排除法**」：
# 先剔掉宣传与回放，其余分组一律保留（= 各项联赛名）。
#
# 为什么不是白名单：真实上游（JSNZKPG）条目的 group-title 是**联赛名**
# （WNBA / 欧俱杯 / 国际友谊 …），而「正在直播 / 赛事回放」只是 M3U 内部的
# **注释分区标记**，不会出现在 group-title 里。早期版本把「正在直播」当白名单，
# 结果真实源 0/88 全被排除（TASK-003 QA-003A）。
# 过滤理由与计数都会写进发布摘要。
[publish.dynamic]
# 【留空 = 不启用白名单】。填了分组名才切换成**严格白名单模式**（只收列出的组，
# 其余全排除）——给「只想盯某几个组」的用户，同样无需硬编码任何联赛名单。
include_groups = []
# 精确匹配的非赛事分组
exclude_groups = ["宣传", "公告", "推广", "广告"]
# 分组名含这些关键词同样排除（如 ✈️TG频道 之类推广入口）；大小写不敏感
exclude_group_keywords = ["✈️", "TG频道", "TG 频道", "下载", "app"]
# 回放：命中【注释分区名】或【分组名】都算回放（两种上游写法都能识别）
replay_sections = ["赛事回放", "回放", "录像", "重播"]
replay_groups = ["赛事回放", "回放", "录像", "重播"]
# 默认**关闭**：回放不是实时赛事。需要时在命令行/本地配置里显式打开。
include_replay = false

# ---------------------------------------------------------------- 本地调度
# `python -m liptv run` 的长期运行参数（TASK-004）。
# 只在本机跑：不部署云、不做公网暴露、不代理视频流。
#
#   python -m liptv run --once          跑一轮后退出（测试 / 计划任务 / 手工维护）
#   python -m liptv run                 长期循环（Ctrl+C / SIGTERM 干净停止）
#   python -m liptv run --serve         循环的同时提供只读 HTTP 订阅
#   python -m liptv serve               只提供只读 HTTP 订阅（不抓取、不发布、不占锁）

[runtime]
# 完整运行周期（秒）。10800 = 3 小时。
interval_seconds = 10800
# 启动后是否立即跑第一轮
run_on_start = true
# 单实例锁：同一套 data/output 目录不允许两个 scheduler 同时写。
# 必须落在被 .gitignore 忽略的目录里（护栏与 dynamic_tmp_dir 同源）。
lock_path = "out/liptv.lock"
# 运行期状态 JSON（脱敏、原子写、轮次条数封顶）。同样必须在被忽略的目录里。
status_path = "out/runtime-status.json"
# 「多久没成功发布」就算 stale（/healthz 用）。建议取 interval_seconds 的 2–3 倍。
stale_after_seconds = 21600
# 状态文件里保留多少条最近轮次（单文件覆盖式，不做无限增长）
status_history = 5
# 每轮是否主动拉取动态赛事源。**默认 false**：默认不主动访问任何公网动态源。
include_dynamic = false
# 显式要用的动态来源登记名；留空 = 使用数据库中所有 enabled 的动态来源。
# 示例（默认关闭，见上面的 [[sources]] 段）：
#   dynamic_sources = ["jsnzkpg-sports"]
dynamic_sources = []
# 动态失败/缺失时是否整轮拒绝发布。默认 false = 沿用 TASK-003 fail-closed：
# 只发布固定频道，且**绝不**从旧文件回拼动态签名 URL。
require_dynamic = false

# ---------------------------------------------------------------- 只读订阅服务
# 给播放器一个固定地址：http://<host>:<port>/live.m3u
#
# 只读：只返回当前已发布的 M3U 文件与最小健康状态；**绝不代理任何视频流**，
# 也不会去请求条目里的播放地址。除下面两个路由外一律 404。
# live.m3u 不存在（或为空）时返回 503 —— 不会生成空列表冒充成功。

[server]
# 是否随 `run` 一起启动 HTTP 服务（`run --serve` / `run --no-serve` 可逐次覆盖）
enabled = false
# 默认只绑本机回环地址。改成 "0.0.0.0" 会把只读订阅暴露给整个局域网，
# 需要显式配置，启动时也会打印安全提示。
host = "127.0.0.1"
port = 8080
playlist_path = "/live.m3u"
# 健康检查：status = ok / stale / missing，以及「距上次成功发布多久」；
# 不含任何 stream URL、签名、数据库内容或来源清单。
health_path = "/healthz"

# ---------------------------------------------------------------- 真实流测活（TASK-005）
# 用本机 ffprobe 对**已入库的固定频道**做短时、受控、只读探测，结果写进 probe_result，
# 由既有选线规则使用。只测固定库存：动态赛事临时 URL 永远不进 probe_result。
#
#   python -m liptv probe-check           只检查 ffprobe 可执行文件与版本（不请求任何 stream）
#   python -m liptv probe-run             对全部固定库存做一轮真实测活
#   python -m liptv probe-run --stream-id 12
#   python -m liptv probe-run --dry-run   只探测、不写库
#
# 本工具**不**负责下载安装 ffmpeg/ffprobe，也不提交任何二进制。

[probe]
# 【安全默认：false】升级后 scheduler 不会突然去请求全部播放流。
# false 时 `run` 的每轮 0 次 ffprobe，probe-run 也只会打印「已禁用」而什么都不做。
enabled = false
# 测活节点名 / 位置（对应 probe 表；schema 已预置 windows-local 与 shanghai-cloud）
name = "windows-local"
location = "Windows"
# ffprobe 可执行文件（允许绝对路径，例如 "C:/ffmpeg/bin/ffprobe.exe"）。
# 也可以写成**数组**（可执行文件 + 前置参数），用于 ffprobe 被包装脚本封装的场景；
# 数组同样走 argv 直传、不做任何 shell 解析，例如：
#   ffprobe_path = ["python", "tools/fake_ffprobe.py"]
ffprobe_path = "ffprobe"
# 单条流的总超时（秒）：超过即 terminate/kill 并回收，绝不允许无限挂住。
timeout_seconds = 12.0
# 交给 ffprobe 自己的分析时长（秒）→ -analyzeduration；避免长时间拉流。
analyze_seconds = 4.0
# 并发 worker 数（标准库 ThreadPoolExecutor）。
max_concurrency = 4
# 0 = 不额外限制条数（仍受并发限制）；正数 = 每轮最多测这么多条。
per_round_limit = 0

# TASK-010 显式频道 alias 表（任务书 §5.4）
#
# 用途：把「同一频道的**不同写法**」映射到同一个 canonical。
# ⚠️ 本表**不是**频道合并表，也不是 fuzzy/Levenshtein 自动纠正 ——
#    每一行都必须是**人工逐条确认过的确定性映射**（§5.4「只有在人工/规则能
#    明确证明是同一频道时使用」）。
#
# ── 安全约束（§5.4 全条落实）────────────────────────────────────────
#   1. **可审计**：每行都带note，写明为什么这是同一频道；
#   2. **不含 stream URL**：本文件只有频道名映射，绝不出现任何播放地址；
#   3. **冲突 fail-closed**：一个 alias 指向两个不同 canonical ⇒ 直接报错，
#      绝不「后者覆盖前者」；
#   4. **不跨语义频道**：alias 只允许在「同一频道的不同线路写法」之间使用，
#      **禁止** `CCTV-5`↔`CCTV-5+`、`CCTV-5`↔`CCTV-6` 这类跨频道映射。
#
# ── 本轮实际收录的 alias 类型─────────────────────────────────────────
#   只有一个类型：**HD 清晰度后缀**。
#   实测两个已采用源里，「同一频道不同写法」的差异只有这一类
#   （见 SOURCES/FIXED-SOURCE-RECON-TASK010.md 的 alias 候选分析）：
#     CCTV-1 / CCTV-1 HD / CCTV-1 (720p) / CCTV-1 HD (1080p)  → 归一后剩 CCTV-1 与 CCTV-1 HD
#
#   为什么 `HD` 可以alias 而 `CCTV-5`↔`CCTV-5+` 不可以：
#     * `CCTV-1 HD` 与 `CCTV-1` 是**同一套节目源的清晰度变体**，
#       属§2A 允许的「高清/超清只是同频道不同线路」；
#     * `CCTV-5` 与 `CCTV-5+` 是**两个不同频道**（常规体育 vs 赛事频道），
#       §2A 明令不得合并。
#
#   注意这与 TASK-009 的`normalize_name()` 不同：
#     * `normalize_name()` **只**剥末尾 `(720p)/(1080p)` 这类分辨率括号；
#     * `HD` 是**裸后缀**（不在括号内），normalize_name 不剥它 ⇒ 需要本alias 表。
#     这条边界TASK-009 报告 §7 已明确列为「拒绑」示例，本轮通过**显式 alias**
#     而非放松 normalize_name 来处理 —— 保持归一规则本身仍然严格。
#
# ── 加载方────────────────────────────────────────────────────────────
#   `tools/build_fixed_seed.py` 在 exact_normalized 匹配**之后**、判定 ambiguous
#   **之前**应用本表；应用后若导致任一来源内出现多原始名撞同一 key，
#   该 canonical 仍按既有规则判 ambiguous 并跳过（fail-closed）。
#   alias 只能**减少**未绑定条目，**不能**让歧义条目蒙混过关。

# ============================== 央视 HD 线路归并 ==============================

[[alias]]
canonical = "CCTV-1 综合"
from = "CCTV-1 HD"
note = "CCTV-1 的 HD 清晰度变体；同一节目源不同码率，§2A 允许作为 stream variant"

[[alias]]
canonical = "CCTV-6 电影"
from = "CCTV-6 HD"
note = "CCTV-6 的 HD 变体。注意**不是** 'CCTV-6 [Geo-blocked]' —— 后者按 §3.3 排除"

[[alias]]
canonical = "CCTV-13 新闻"
from = "CCTV-13 HD"
note = "CCTV-13 的 HD 变体；§2A 点名频道"

[[alias]]
canonical = "CCTV-14 少儿"
from = "CCTV-14 HD"
note = "CCTV-14 的 HD 变体；§2A 点名频道"

[[alias]]
canonical = "CCTV-17 农业农村"
from = "CCTV-17 HD"
note = "CCTV-17 的 HD 变体；§2A 点名频道"

# ============================== 刻意不建立的 alias ==============================
#
# 以下都是**明确禁止**的跨语义映射，本文件**故意不收录**，以免被误当成规则：
#
#   CCTV-5  ↔ CCTV-5+        ✗ 常规体育频道 vs 体育赛事频道（§2A 明令不合并）
#   CCTV-6  ↔ CCTV-4K HD     ✗ 不同频道 + §6.4「不追求 4K」
#   CCTV-8  ↔ CCTV-8K HD     ✗ 同上
#   CCTV-2  ↔ CCTV-2 财经    ✗ 已有 canonical 名（显示名），不是源侧写法差异
#   湖南卫视 ↔湖南卫视 HD   ✗ 未在实测数据中出现；不凭「可能存在」建立规则
#   Anhui TV ↔ 安徽卫视      ✗ 跨语言，§5.3 明令本轮不做
#
# 最后一条特别说明：**不建立「臆测性alias」**。即便某些源「通常」会写
# `Anhui TV`，只要本轮两个已采用源的实测数据里没出现，就不写进规则 ——
# 规则表只记录**有证据**的映射。
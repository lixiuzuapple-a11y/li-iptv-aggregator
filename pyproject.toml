[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "li-iptv-aggregator"
version = "0.1.0"
description = "个人自用 IPTV 源聚合与自动维护（V1 最小骨架）"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
liptv = "liptv.cli:main"

[tool.setuptools]
packages = ["liptv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
